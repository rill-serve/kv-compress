[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kv-compression"
version = "0.1.0"
description = "Lossless (bit-exact) KV-cache compression: channel-major byte-plane split + zstd"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "zstandard>=0.22",
]

[project.optional-dependencies]
torch = ["torch>=2.0"]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["kv_compression"]

[tool.pytest.ini_options]
testpaths = ["tests"]
